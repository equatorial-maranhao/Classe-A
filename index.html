<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102f71">
<title>Classe A | Equatorial Maranhão</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102f71'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='Arial' font-weight='bold' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<meta name="description" content="Acompanhamento dos ciclos do Classe A: cursos, feedbacks, RRs e PMS.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOADING -->
<div id="view-loading" class="center-screen"><div class="spinner"></div></div>

<!-- LOGIN / CADASTRO -->
<div id="view-auth" class="center-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-brand">Equatorial Maranhão</div>
    <h1 class="auth-title">Classe A</h1>
    <div class="auth-tabs">
      <button type="button" id="auth-tab-login" class="auth-tab active">Entrar</button>
      <button type="button" id="auth-tab-signup" class="auth-tab">Solicitar acesso</button>
    </div>
    <form id="form-login" class="auth-form">
      <label>E-mail</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label>Senha</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <p id="login-error" class="form-error"></p>
      <button type="submit" class="btn-primary full">Entrar</button>
    </form>
    <form id="form-signup" class="auth-form" style="display:none">
      <label>Nome completo</label>
      <input type="text" id="signup-name" required>
      <label>E-mail</label>
      <input type="email" id="signup-email" required autocomplete="username">
      <label>Crie uma senha</label>
      <input type="password" id="signup-password" required autocomplete="new-password" minlength="6">
      <label>Mensagem (opcional)</label>
      <textarea id="signup-message" rows="2" placeholder="Ex: sou o Felipe, da equipe de marketing"></textarea>
      <p id="signup-error" class="form-error"></p>
      <button type="submit" class="btn-primary full">Solicitar acesso</button>
    </form>
  </div>
</div>

<!-- PENDENTE DE APROVAÇÃO -->
<div id="view-pending" class="center-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-brand">Equatorial Maranhão</div>
    <h1 class="auth-title">Classe A</h1>
    <div id="pending-box" class="pending-box"></div>
    <button type="button" class="btn-secondary full" onclick="location.reload()">Atualizar</button>
    <button type="button" class="link-btn" id="pending-logout" style="margin-top:10px">Sair</button>
  </div>
</div>

<!-- APP -->
<div id="view-app" style="display:none">
  <header>
    <div class="header-deco" aria-hidden="true"></div>
    <svg class="header-waves" viewBox="0 0 1288 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="header-bokeh-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
      </defs>
      <g>
        <path d="M-60,400.0 C170,400.0 210,190.0 420,170.0 C640,145.0 690,10.0 900,10.0" fill="none" stroke="#ffffff" stroke-opacity="0.220" stroke-width="1.3"/>
        <path d="M-60,420.0 C170,420.0 210,201.0 420,181.0 C640,156.0 690,17.0 900,17.0" fill="none" stroke="#ffffff" stroke-opacity="0.207" stroke-width="1.3"/>
        <path d="M-60,440.0 C170,440.0 210,212.0 420,192.0 C640,167.0 690,24.0 900,24.0" fill="none" stroke="#ffffff" stroke-opacity="0.194" stroke-width="1.3"/>
        <path d="M-60,460.0 C170,460.0 210,223.0 420,203.0 C640,178.0 690,31.0 900,31.0" fill="none" stroke="#ffffff" stroke-opacity="0.181" stroke-width="1.3"/>
        <path d="M-60,480.0 C170,480.0 210,234.0 420,214.0 C640,189.0 690,38.0 900,38.0" fill="none" stroke="#ffffff" stroke-opacity="0.168" stroke-width="1.3"/>
        <path d="M-60,500.0 C170,500.0 210,245.0 420,225.0 C640,200.0 690,45.0 900,45.0" fill="none" stroke="#ffffff" stroke-opacity="0.155" stroke-width="1.3"/>
        <path d="M-60,520.0 C170,520.0 210,256.0 420,236.0 C640,211.0 690,52.0 900,52.0" fill="none" stroke="#ffffff" stroke-opacity="0.142" stroke-width="1.3"/>
        <path d="M-60,540.0 C170,540.0 210,267.0 420,247.0 C640,222.0 690,59.0 900,59.0" fill="none" stroke="#ffffff" stroke-opacity="0.129" stroke-width="1.3"/>
        <path d="M-60,560.0 C170,560.0 210,278.0 420,258.0 C640,233.0 690,66.0 900,66.0" fill="none" stroke="#ffffff" stroke-opacity="0.116" stroke-width="1.3"/>
        <path d="M-60,580.0 C170,580.0 210,289.0 420,269.0 C640,244.0 690,73.0 900,73.0" fill="none" stroke="#ffffff" stroke-opacity="0.103" stroke-width="1.3"/>
        <path d="M-60,600.0 C170,600.0 210,300.0 420,280.0 C640,255.0 690,80.0 900,80.0" fill="none" stroke="#ffffff" stroke-opacity="0.090" stroke-width="1.3"/>
      </g>
      <g filter="url(#header-bokeh-blur)">
        <circle cx="95" cy="190" r="42" fill="#ffffff" opacity="0.18"/>
        <circle cx="175" cy="260" r="26" fill="#ffffff" opacity="0.16"/>
        <circle cx="245" cy="150" r="18" fill="#ffffff" opacity="0.15"/>
        <circle cx="330" cy="220" r="13" fill="#ffffff" opacity="0.17"/>
        <circle cx="410" cy="170" r="23" fill="#ffffff" opacity="0.14"/>
        <circle cx="495" cy="235" r="15" fill="#ffffff" opacity="0.15"/>
        <circle cx="565" cy="155" r="11" fill="#ffffff" opacity="0.13"/>
        <circle cx="640" cy="205" r="18" fill="#ffffff" opacity="0.12"/>
        <circle cx="710" cy="160" r="10" fill="#ffffff" opacity="0.1"/>
      </g>
    </svg>
    <div class="shell">
      <div class="bar">
        <div class="wordmark-group">
          <span class="logo-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.67 0-8 1.34-8 4v2h10v-2c0-1.35.68-2.46 1.76-3.32C10.5 13.16 9.14 13 8 13Zm8 0c-.29 0-.62.02-.97.05C16.2 13.84 17 14.84 17 16v2h7v-2c0-2.66-5.33-4-8-4Z" fill="currentColor"/></svg>
          </span>
          <div class="wordmark">Equatorial Maranhão</div>
        </div>
        <div class="user-box">
          <button type="button" id="my-avatar-btn" class="my-avatar" title="Minha foto">
            <span id="my-avatar-img"></span>
            <svg class="cam-badge" width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <span id="user-role" class="role-badge"></span>
          <span id="user-name" class="user-name"></span>
          <button type="button" id="logout-btn" class="link-btn">Sair</button>
        </div>
      </div>
      <div class="masthead">
        <div>
          <div class="eyebrow">Gerência de Comunicação e Marketing</div>
          <h1>Classe A</h1>
          <p>Um lugar para acompanhar as entregas do ciclo, reconhecer o que avançou e enxergar com clareza o que ainda precisa acontecer.</p>
        </div>
        <div class="masthead-deco" aria-hidden="true">
          <svg class="tagline-script" viewBox="0 0 220 90" width="190">
            <text x="4" y="34" font-family="Segoe Script, Brush Script MT, cursive" font-size="24" fill="#ffffff" transform="rotate(-6 4 34)">Juntos</text>
            <text x="4" y="60" font-family="Segoe Script, Brush Script MT, cursive" font-size="24" fill="#ffffff" transform="rotate(-6 4 60)">vamos mais</text>
            <text x="4" y="86" font-family="Segoe Script, Brush Script MT, cursive" font-size="24" fill="#ffffff" transform="rotate(-6 4 86)">longe!</text>
          </svg>
          <svg class="target-icon" width="64" height="64" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="13" r="8" stroke="#ffffffaa" stroke-width="1.6"/><circle cx="11" cy="13" r="4.5" stroke="#ffffffaa" stroke-width="1.6"/><circle cx="11" cy="13" r="1" fill="#ffffffaa"/><path d="M15 3l4 2-1 4.3-4.3 1.2L13 6l2-3Z" stroke="#ffffffaa" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div id="cycle-tabs" class="cycle-tabs"></div>
      <nav class="main-nav" id="main-nav">
        <button type="button" id="tab-admin-btn" class="main-tab" data-tab="admin" style="display:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.67 0-8 1.34-8 4v2h10v-2c0-1.35.68-2.46 1.76-3.32C10.5 13.16 9.14 13 8 13Zm8 0c-.29 0-.62.02-.97.05C16.2 13.84 17 14.84 17 16v2h7v-2c0-2.66-5.33-4-8-4Z" fill="currentColor"/></svg>Administração</button>
        <button type="button" class="main-tab" data-tab="sobre"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>Sobre o ciclo</button>
        <button type="button" class="main-tab active" data-tab="visao"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Visão geral</button>
        <button type="button" class="main-tab" data-tab="meses"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Por mês</button>
        <button type="button" class="main-tab" data-tab="pessoas"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.67 0-8 1.34-8 4v2h10v-2c0-1.35.68-2.46 1.76-3.32C10.5 13.16 9.14 13 8 13Zm8 0c-.29 0-.62.02-.97.05C16.2 13.84 17 14.84 17 16v2h7v-2c0-2.66-5.33-4-8-4Z" fill="currentColor"/></svg>Colaboradores</button>
      </nav>
    </div>
  </header>
  <main class="shell main">
    <div class="page-deco" aria-hidden="true"></div>
    <section class="tab-panel" id="panel-visao"></section>
    <section class="tab-panel" id="panel-pessoas" style="display:none"></section>
    <section class="tab-panel" id="panel-meses" style="display:none"></section>
    <section class="tab-panel" id="panel-sobre" style="display:none"></section>
    <section class="tab-panel" id="panel-admin" style="display:none"></section>
  </main>
</div>

<!-- MODAL -->
<div id="modal-backdrop" class="modal-backdrop" style="display:none">
  <div class="modal-card" id="modal-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
